name: ClauseBid source checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m compileall -q contracts
      - run: python -m pytest -q tests/test_commit_vectors.py
      - run: genvm-lint check contracts/clausebid.py
      - name: Supply renamed GenVM runner asset to pinned Direct Mode test loader
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          ls -lh "$HOME/.cache/genvm-linter" || true
          cp "$HOME"/.cache/genvm-linter/genvm-universal-*.tar.xz "$HOME/.cache/gltest-direct/" || echo "Runner cache path differs; Direct Mode reports the provider blocker"
      - run: pytest tests/direct -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix frontend
      - run: npm run test --prefix frontend
